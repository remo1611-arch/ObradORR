<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>ObradORR · Inicio</title>
  <link rel="icon" href="../favicon.ico" />
  <link rel="stylesheet" href="./css/obradorr.css?v=obradorr-100-rc5" />
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite">
    <main class="main">
      <section class="card">
        <h1>ObradORR</h1>
        <p>Cargando aplicación y base SQLite...</p>
        <div class="notice"><b>Arranque local:</b> usa servidor local desde la raíz del proyecto. No abras este archivo directamente con <code>file://</code>.</div>
      </section>
    </main>
  </div>
  <div id="modal-root"></div>
  <input type="file" id="dbFileInput" class="hidden" accept=".sqlite,.db,application/vnd.sqlite3,application/octet-stream" />
  <script>
    window.__OBRADORR_MODULE_STARTED = false;
    window.__OBRADORR_BOOT_BUILD = 'obradorr-100-rc5';
    window.__OBRADORR_BOOT_ERRORS = [];
    function __obradorrEsc(s) { return String(s || '').replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function __obradorrPushBootError(label, value) {
      try { window.__OBRADORR_BOOT_ERRORS.push(label + ': ' + (value && value.message ? value.message : String(value || 'error'))); } catch(e) {}
    }
    window.addEventListener('error', function (event) {
      var where = event.filename ? (' · ' + event.filename.split('/').slice(-2).join('/') + ':' + (event.lineno || 0)) : '';
      __obradorrPushBootError('error' + where, event.message || event.error);
    }, true);
    window.addEventListener('unhandledrejection', function (event) { __obradorrPushBootError('promise', event.reason); }, true);
    window.setTimeout(function () {
      var app = document.getElementById('app');
      var stillStatic = app && /Cargando aplicación y base SQLite/.test(app.textContent || '');
      if (!window.__OBRADORR_MODULE_STARTED && stillStatic) {
        var details = (window.__OBRADORR_BOOT_ERRORS || []).map(function(e) { return '<li><code>' + __obradorrEsc(e) + '</code></li>'; }).join('');
        app.innerHTML = '<main class="main"><section class="card"><h1>ObradORR</h1><h2>No se ha ejecutado el JavaScript principal</h2><p>El HTML se ha cargado, pero la aplicación no llegó a iniciar.</p><div class="notice"><b>Diagnóstico:</b> el navegador ha rechazado o bloqueado algún script de arranque. Esta compilación usa cargador clásico compatible, sin depender de <code>type="module"</code>.</div>' + (details ? '<h3>Error capturado</h3><ul>' + details + '</ul>' : '<p>No se capturó detalle del error. Revisa la consola del navegador.</p>') + '<p>Abre una URL nueva: <code>app/obradorr.html?v=obradorr-100-rc5</code>. Si venías de una versión anterior, ejecuta <code>app/reset_local_data.html?v=obradorr-100-rc5</code>.</p></section></main>';
      }
    }, 7000);
  </script>
  <script defer src="./wasm/sqlite3-classic.js?v=obradorr-100-rc5"></script>
  <script defer src="./js/obradorr-db-classic.js?v=obradorr-100-rc5"></script>
  <script defer src="./js/obradorr-app-classic.js?v=obradorr-100-rc5"></script>
</body>
</html>
